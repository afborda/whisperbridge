[project]
name = "whisperbridge"
version = "0.1.0"
description = "Legendas ao vivo locais: captura o áudio do PC, transcreve com Whisper e traduz."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
