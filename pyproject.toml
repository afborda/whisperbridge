[project]
name = "whisperbridge"
version = "0.1.0"
description = "Legendas ao vivo para Zoom, Teams e Meet. Whisper transcreve no PC; o áudio da reunião não sai da máquina."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
