<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Como o WhisperBridge funciona</title>
  <desc id="d">Captura o som do PC ou do microfone, transcreve com Whisper no seu computador, traduz o texto e mostra a legenda por cima da reunião.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="55%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070b18" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#glow)"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 92 H1200"/>
    <path d="M0 420 H1200"/>
  </g>

  <text x="48" y="42" fill="#67e8f9" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3">COMO FUNCIONA</text>
  <text x="48" y="72" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" font-weight="700">Do áudio da reunião até a legenda na sua tela</text>
  <text x="1152" y="58" text-anchor="end" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13">áudio nunca sai do PC</text>

  <!-- connectors -->
  <g stroke="url(#line)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M300 230 H348"/>
    <path d="M568 230 H616"/>
    <path d="M836 230 H884"/>
  </g>
  <g fill="#a5b4fc">
    <polygon points="344,224 356,230 344,236"/>
    <polygon points="612,224 624,230 612,236"/>
    <polygon points="880,224 892,230 880,236"/>
  </g>

  <!-- card 1 -->
  <g filter="url(#soft)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect x="40" y="110" width="256" height="236" rx="22" fill="#0f172a" stroke="#1e3a4c"/>
    <circle cx="168" cy="168" r="28" fill="#042f2e"/>
    <g transform="translate(168 168)" fill="none" stroke="url(#c1)" stroke-width="2.2" stroke-linecap="round">
      <rect x="-11" y="-8" width="10" height="16" rx="3"/>
      <path d="M4 -7 v14 M9 -4 v8"/>
      <path d="M-16 14 h32"/>
    </g>
    <text x="168" y="220" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1.4">1  ·  CAPTURAR</text>
    <text x="168" y="248" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="650">Som do PC ou microfone</text>
    <text x="56" y="278" text-anchor="start" fill="#94a3b8" font-size="12">Ouve o que toca no Windows</text>
    <text x="56" y="296" text-anchor="start" fill="#94a3b8" font-size="12">(Teams, Zoom, Meet, YouTube)</text>
    <text x="56" y="314" text-anchor="start" fill="#64748b" font-size="12">ou o que você fala no microfone.</text>
  </g>

  <!-- card 2 -->
  <g filter="url(#soft)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect x="308" y="110" width="256" height="236" rx="22" fill="#0f172a" stroke="#1e2a4c"/>
    <circle cx="436" cy="168" r="28" fill="#0b1c3a"/>
    <g transform="translate(436 168)" fill="none" stroke="url(#c2)" stroke-width="2.2" stroke-linecap="round">
      <rect x="-12" y="-10" width="24" height="20" rx="4"/>
      <path d="M-6 14 h12"/>
      <path d="M-5 -3 v6 M0 -6 v12 M5 -3 v6"/>
    </g>
    <text x="436" y="220" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.4">2  ·  OUVIR</text>
    <text x="436" y="248" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="650">Whisper no seu PC</text>
    <text x="324" y="278" text-anchor="start" fill="#94a3b8" font-size="12">A transcrição roda localmente.</text>
    <text x="324" y="296" text-anchor="start" fill="#94a3b8" font-size="12">O áudio da reunião não vai</text>
    <text x="324" y="314" text-anchor="start" fill="#64748b" font-size="12">para a nuvem. Nunca.</text>
  </g>

  <!-- card 3 -->
  <g filter="url(#soft)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect x="576" y="110" width="256" height="236" rx="22" fill="#0f172a" stroke="#2a1e4c"/>
    <circle cx="704" cy="168" r="28" fill="#1e1038"/>
    <g transform="translate(704 168)" fill="none" stroke="url(#c3)" stroke-width="2.2" stroke-linecap="round">
      <path d="M-12 -4 h10 l4 4 -4 4 h-10 z"/>
      <path d="M12 4 h-10 l-4 -4 4 -4 h10 z"/>
    </g>
    <text x="704" y="220" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1.4">3  ·  TRADUZIR</text>
    <text x="704" y="248" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="650">IA sua, ou neste PC</text>
    <text x="592" y="278" text-anchor="start" fill="#94a3b8" font-size="12">Gemini, GPT, DeepSeek…</text>
    <text x="592" y="296" text-anchor="start" fill="#94a3b8" font-size="12">com a chave que você cola.</text>
    <text x="592" y="314" text-anchor="start" fill="#64748b" font-size="12">Só o texto. Sem áudio.</text>
  </g>

  <!-- card 4 -->
  <g filter="url(#soft)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect x="844" y="110" width="316" height="236" rx="22" fill="#0f172a" stroke="#3b1e4c"/>
    <circle cx="1002" cy="168" r="28" fill="#2a1030"/>
    <g transform="translate(1002 168)" fill="none" stroke="url(#c4)" stroke-width="2.2" stroke-linecap="round">
      <rect x="-13" y="-9" width="26" height="18" rx="3"/>
      <path d="M-8 -3 h16 M-8 2 h11 M-8 7 h8"/>
    </g>
    <text x="1002" y="220" text-anchor="middle" fill="#e879f9" font-size="12" font-weight="700" letter-spacing="1.4">4  ·  LEGENDAR</text>
    <text x="1002" y="248" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="650">Janela por cima de tudo</text>
    <text x="860" y="278" text-anchor="start" fill="#94a3b8" font-size="12">Overlay no Teams / Meet / Zoom</text>
    <text x="860" y="296" text-anchor="start" fill="#94a3b8" font-size="12">ou a mesma UI no navegador.</text>
    <g font-size="11" font-weight="700">
      <rect x="860" y="316" width="36" height="18" rx="9" fill="#134e4a"/><text x="878" y="329" text-anchor="middle" fill="#5eead4">PT</text>
      <rect x="902" y="316" width="36" height="18" rx="9" fill="#1e3a5f"/><text x="920" y="329" text-anchor="middle" fill="#7dd3fc">ES</text>
      <rect x="944" y="316" width="36" height="18" rx="9" fill="#3b1d4a"/><text x="962" y="329" text-anchor="middle" fill="#e9d5ff">TH</text>
      <rect x="986" y="316" width="36" height="18" rx="9" fill="#3b1d2e"/><text x="1004" y="329" text-anchor="middle" fill="#f9a8d4">JA</text>
      <text x="1034" y="329" fill="#64748b" font-weight="500">você escolhe</text>
    </g>
  </g>

  <text x="48" y="442" fill="#64748b" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12">WhisperBridge · transcrição local · tradução opcional na nuvem · código aberto</text>
</svg>
