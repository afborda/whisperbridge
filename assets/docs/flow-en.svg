<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-label="How WhisperBridge works">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ec8ff"/>
      <stop offset="100%" stop-color="#b07cff"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06101f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1100" height="320" rx="20" fill="#0a1028"/>
  <text x="40" y="42" fill="#8aa0c8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" letter-spacing="1.4">HOW IT WORKS</text>
  <text x="40" y="68" fill="#e8eefc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">From meeting audio to live subtitles</text>

  <g font-family="Segoe UI, system-ui, sans-serif" filter="url(#s)">
    <rect x="36" y="100" width="190" height="150" rx="16" fill="#121a36" stroke="#2a3a66"/>
    <text x="131" y="138" text-anchor="middle" fill="#3ec8ff" font-size="13" font-weight="700">1 · CAPTURE</text>
    <text x="131" y="168" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">PC playback or</text>
    <text x="131" y="190" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">microphone</text>
    <text x="131" y="220" text-anchor="middle" fill="#8aa0c8" font-size="12">WASAPI · on-device</text>

    <rect x="256" y="100" width="190" height="150" rx="16" fill="#121a36" stroke="#2a3a66"/>
    <text x="351" y="138" text-anchor="middle" fill="#5aa8ff" font-size="13" font-weight="700">2 · LISTEN</text>
    <text x="351" y="168" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">Whisper runs on</text>
    <text x="351" y="190" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">your computer</text>
    <text x="351" y="220" text-anchor="middle" fill="#8aa0c8" font-size="12">audio never leaves the PC</text>

    <rect x="476" y="100" width="190" height="150" rx="16" fill="#121a36" stroke="#2a3a66"/>
    <text x="571" y="138" text-anchor="middle" fill="#8b7cff" font-size="13" font-weight="700">3 · TRANSLATE</text>
    <text x="571" y="168" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">Your AI (Gemini…)</text>
    <text x="571" y="190" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">or local fallback</text>
    <text x="571" y="220" text-anchor="middle" fill="#8aa0c8" font-size="12">text only, never audio</text>

    <rect x="696" y="100" width="190" height="150" rx="16" fill="#121a36" stroke="#2a3a66"/>
    <text x="791" y="138" text-anchor="middle" fill="#b07cff" font-size="13" font-weight="700">4 · SUBTITLES</text>
    <text x="791" y="168" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">Always-on-top</text>
    <text x="791" y="190" text-anchor="middle" fill="#f2f6ff" font-size="15" font-weight="600">overlay or browser</text>
    <text x="791" y="220" text-anchor="middle" fill="#8aa0c8" font-size="12">over Teams / Meet / Zoom</text>
  </g>

  <g fill="url(#g)">
    <polygon points="232,175 250,168 250,182"/>
    <polygon points="452,175 470,168 470,182"/>
    <polygon points="672,175 690,168 690,182"/>
  </g>
  <text x="910" y="168" fill="#8aa0c8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">PT, TH, ES…</text>
  <text x="910" y="188" fill="#8aa0c8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">you choose</text>
</svg>
